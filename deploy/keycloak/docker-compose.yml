# Keycloak для платформы: Postgres + Keycloak, HTTP (без TLS).
#
# TLS терминирует nginx на хосте (когда появится сертификат); сейчас контур
# работает по HTTP на 127.0.0.1. Снаружи ничего не публикуется — оба порта
# забинжены на loopback.
#
# Быстрый старт:
#   cp .env.example .env
#   # задайте пароли в .env
#   docker compose up -d
#   # readiness: http://127.0.0.1:8081/auth/realms/tidi/.well-known/openid-configuration
#   # админ-консоль:  http://127.0.0.1:8081/auth/admin/
#   # realm тиди:     http://127.0.0.1:8081/auth/realms/tidi
#
# Realm импортируется из ./tidi-realm.json при ПЕРВОМ старте (start --import-realm).
# Если realm уже существует — импорт пропускается (см. README), пользователи и
# роли, созданные через админ-консоль, не затрутся при рестарте.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- начальный админ (только первая инициализация) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:?set KC_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}

      # --- база ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}

      # --- HTTP без TLS; динамический hostname (issuer = как обратились) ---
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Keycloak отдаётся наружу nginx'ом по пути /auth/ на порту 8005
      KC_HTTP_RELATIVE_PATH: /auth
      # за nginx будут X-Forwarded-* заголовки
      KC_PROXY_HEADERS: xforwarded

      # Подстановка ${PUBLIC_IP} в tidi-realm.json (redirect URIs / web origins).
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env}

      # --- операции ---
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8081:8080"
    # Стоковый образ не содержит quarkus-smallrye-health, поэтому /health/* и
    # /metrics на management-порту 9000 отдают 404 (KC_HEALTH_ENABLED на это
    # не влияет). Readiness проверяем через discovery реального realm на
    # основном порту (8080) — bash /dev/tcp, т.к. в образе нет curl/wget.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /auth/realms/tidi/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q " 200 " <&3'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      # Realm импортируется при первом старте и дальше пропускается.
      - ./tidi-realm.json:/opt/keycloak/data/import/tidi-realm.json:ro

volumes:
  pgdata:
